<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Source English</title>
    <script>
      // GitHub Pages SPA redirect script
      // This script takes the current page pathname and redirects to the index page
      // with the pathname as a query parameter. This allows the SPA router to handle it.

      var pathSegmentsToKeep = 0; // Change this if your site is hosted in a subfolder

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body>
    <noscript>
      <p>
        This application requires JavaScript to function properly. Please enable
        JavaScript and try again.
      </p>
      <p><a href="/">Go to homepage</a></p>
    </noscript>
  </body>
</html>
